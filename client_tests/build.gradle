plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':client')
    implementation 'org.testng:testng:7.5'
}

test {
    useTestNG() {
        suites 'testng.xml'
    }
}